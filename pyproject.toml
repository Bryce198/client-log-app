[project]
name = "thealth-client-app"
version = "0.1.0"
description = "Client logging app for Outreach at Transformation Health LLC team to use"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
]

[project.scripts]
thealth-client-app = "thealth_client_app.main:main"

[tool.uv.build-backend]
module-root = "backend/src"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
